opencollection: 1.0.0

info:
  name: TAE_Project-CLI
  version: "0.1"
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  headers:
    - name: Accept
      value: application/json
      description: Ask the API to send data in JSON format.
  auth:
    type: bearer
    token: "{{TokenID}}"
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
